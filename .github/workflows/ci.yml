name: CI

on:
  push:
  # Lets the CI fixer (oat-tools/tools/ci-fixer) re-run CI to confirm a fix.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The render test uses one pinned Chrome for Testing build (see
      # test/test-browser.ts), cached between runs.
      - uses: actions/cache@v6
        with:
          path: .cache/test-browser
          key: test-browser-${{ runner.os }}-${{ hashFiles('test/test-browser.ts') }}
      - run: npm run test-browser
      # DRAFTSMAN_TEST_PACK also installs the packed tarball into an empty
      # folder and lists its tools, which needs the npm registry.
      - run: npm test
        env:
          DRAFTSMAN_TEST_PACK: '1'
      # On a render mismatch, keep what CI drew and the diff for a look.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-output
          path: test/output/
          if-no-files-found: ignore

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      # The VS Code the tests run in (see src/test/run.ts), cached between runs.
      - uses: actions/cache@v6
        with:
          path: extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('extension/src/test/run.ts') }}
      - run: xvfb-run -a npm test

  private-names:
    name: Private names check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so every commit message is checked too.
          fetch-depth: 0
      - run: scripts/check-private-names.sh
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
