name: CI

on: push

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          # The runner's preinstalled Google Chrome renders the images.
          # CI containers can't always give Chrome its sandbox.
          DRAFTSMAN_NO_SANDBOX: '1'

  private-names:
    name: Private names check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so every commit message is checked too.
          fetch-depth: 0
      - run: scripts/check-private-names.sh
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
